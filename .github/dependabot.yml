version: 2

# 每周一次的依赖更新 PR（审计 C-M5 的"供应链自动化"那一半）。
# 镜像发布/构建用的 action 全部锁了 commit SHA（见 .github/workflows/），
# 靠 github-actions 这一项保持更新；Dockerfile 里锁的 digest / apk 版本同理。
updates:
  # pnpm workspace：根 package.json + pnpm-lock.yaml（workspace 子包一并覆盖）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  # Dockerfile / Dockerfile.allinone / docker-compose.yml 里的基础镜像（含 digest）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

  # GitHub Actions（本仓库锁的是 SHA，版本注释写在行尾）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
