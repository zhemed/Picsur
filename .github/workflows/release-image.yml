name: release-image

# 构建并发布镜像到 ghcr.io/zhemed/picsur
#
# 触发：
#   - 推送 v* tag（发版）：产出 :<版本> 与 :latest
#   - 手动 workflow_dispatch：只产出 :latest（用来刷新）
#
# 只用内置 GITHUB_TOKEN（packages: write），不需要任何额外 secret。
# 镜像内容与本地 `docker compose up -d --build` 完全一致（同一个 Dockerfile）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 让运行页直接看到拉取命令
      # all-in-one 变体（内嵌 PostgreSQL 17）：在常规镜像推完之后构建，基底就是刚推的 :latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.allinone
          push: true
          build-args: |
            PICSUR_BASE_IMAGE=ghcr.io/${{ github.repository }}:latest
          tags: ghcr.io/${{ github.repository }}:allinone
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 让运行页直接看到拉取命令
      - name: summary
        run: |
          {
            echo '### 镜像已发布'
            echo
            echo '```bash'
            echo 'docker pull ghcr.io/${{ github.repository }}:latest'
            echo '```'
            echo
            echo '标签：'
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
