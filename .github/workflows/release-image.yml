name: release-image

# 构建并发布镜像到 ghcr.io/zhemed/picsur
#
# 触发：
#   - 推送 v* tag（正式发版）：产出 :<版本>、:<主.次>、:v<版本>、:latest 与 :allinone
#   - 手动 workflow_dispatch：
#       * 选 tag 触发 → 与上一条一致（会发布）
#       * 选分支触发 → **只构建、不推送**（用来验证 Dockerfile 还能编过；避免把任意分支推成 :latest）
#
# 注意：日常发版默认走本地 `bash support/release-local.sh`（热缓存约 2 分钟；GitHub runner 要 7+ 分钟），
# 这条工作流是备用/可复现路径（干净检出、无本地缓存）。
#
# 只用内置 GITHUB_TOKEN（packages: write），不需要任何额外 secret。
# 镜像内容与本地 `docker compose up -d --build` 完全一致（同一个 Dockerfile）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 只有 tag ref 才发布；分支上的手动触发不需要 ghcr 凭据
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # all-in-one 变体（内嵌 PostgreSQL 17）：只在发布时构建，基底直接用刚构建出来的那个镜像的
      # digest（不用 :latest —— 避免基底被上一次发布或别的跑动串掉）
      - if: github.ref_type == 'tag'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.allinone
          push: true
          build-args: |
            PICSUR_BASE_IMAGE=ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          tags: ghcr.io/${{ github.repository }}:allinone
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary（已发布）
        if: github.ref_type == 'tag'
        run: |
          {
            echo '### 镜像已发布'
            echo
            echo '```bash'
            echo 'docker pull ghcr.io/${{ github.repository }}:latest'
            echo '```'
            echo
            echo '标签：'
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: summary（只构建）
        if: github.ref_type != 'tag'
        run: |
          {
            echo '### 只构建、未发布'
            echo
            echo '本次是 workflow_dispatch 跑在分支上：不推送任何 tag（防串版）。'
            echo '要发版请推 `v*` tag，或用 workflow_dispatch 选一个 tag 触发。'
          } >> "$GITHUB_STEP_SUMMARY"
